rule_version: repair-strategies-v1
strategies:
  champion_replay:
    strategy_code: champion_replay
    plan_code: PLAN_NO_TRAINING
    risk_level: LOW
    description: 修复数据或流水线后使用冻结 Champion 回放
  stable_refit:
    strategy_code: stable_refit
    plan_code: PLAN_STABLE_REFIT
    risk_level: LOW
    description: 同算法、同特征、同超参数重新拟合
  recent_weighted_retrain:
    strategy_code: recent_weighted_retrain
    plan_code: PLAN_RECENT_WEIGHTED
    risk_level: MEDIUM
    description: 对近期成熟样本提高权重
  sliding_window_retrain:
    strategy_code: sliding_window_retrain
    plan_code: PLAN_SLIDING_RECENT
    risk_level: MEDIUM
    description: 使用持续稳定的新分布滑动窗口训练
  segment_weighted_retrain:
    strategy_code: segment_weighted_retrain
    plan_code: PLAN_SEGMENT_WEIGHTED
    risk_level: MEDIUM
    description: 针对受损客群重新加权
  regularized_retrain:
    strategy_code: regularized_retrain
    plan_code: PLAN_REGULARIZED
    risk_level: MEDIUM
    description: 正则化、简化模型并采用时间验证
  feature_reconstruction:
    strategy_code: feature_reconstruction
    plan_code: PLAN_FEATURE_RECONSTRUCTION
    risk_level: HIGH
    description: 过滤或重构脆弱、失效特征
  full_retrain:
    strategy_code: full_retrain
    plan_code: PLAN_FULL_RETRAIN
    risk_level: HIGH
    description: 全局关系变化后的完整重训
  calibration_only:
    strategy_code: calibration_only
    plan_code: PLAN_CALIBRATION_ONLY
    risk_level: MEDIUM
    description: 排序稳定时仅调整概率校准器
  threshold_only:
    strategy_code: threshold_only
    plan_code: PLAN_THRESHOLD_ONLY
    risk_level: HIGH
    description: 排序与校准正常时调整业务阈值
root_cause_rules:
  DATA_MISSING:
    action: DATA_REPAIR
    strategy_codes: [champion_replay]
  SCALE_SHIFT:
    action: PIPELINE_REPAIR
    strategy_codes: [champion_replay]
  FEATURE_STALE:
    action: PIPELINE_REPAIR
    strategy_codes: [champion_replay]
  PREPROCESS_MISMATCH:
    action: PIPELINE_REPAIR
    strategy_codes: [champion_replay]
  FEATURE_FAILURE:
    action: PIPELINE_REPAIR
    strategy_codes: [champion_replay]
  SCHEMA_MISMATCH:
    action: PIPELINE_REPAIR
    strategy_codes: [champion_replay]
  UNKNOWN_CATEGORY_SURGE:
    action: DATA_REPAIR
    strategy_codes: [champion_replay]
  FEATURE_DRIFT:
    action: MODEL_ITERATION
    strategy_codes: [recent_weighted_retrain]
    required_evidence: [D, I, T]
    required_any_evidence: [C, R]
  SEGMENT_DRIFT:
    action: MODEL_ITERATION
    strategy_codes: [segment_weighted_retrain]
  CONCEPT_DRIFT_LOCAL:
    action: MODEL_ITERATION
    strategy_codes: [segment_weighted_retrain]
  CONCEPT_DRIFT_GRADUAL:
    action: MODEL_ITERATION
    strategy_codes: [recent_weighted_retrain]
  CONCEPT_DRIFT_SUDDEN:
    action: MODEL_ITERATION
    strategy_codes: [sliding_window_retrain]
  CONCEPT_DRIFT_GLOBAL:
    action: MODEL_ITERATION
    strategy_codes: [full_retrain]
  FRAUD_PATTERN_SHIFT:
    action: MODEL_ITERATION
    strategy_codes: [segment_weighted_retrain, feature_reconstruction]
  MODEL_AGING:
    action: MODEL_ITERATION
    strategy_codes: [stable_refit]
  FEATURE_FRAGILITY:
    action: MODEL_ITERATION
    strategy_codes: [regularized_retrain, feature_reconstruction]
  OVERFITTING:
    action: MODEL_ITERATION
    strategy_codes: [regularized_retrain]
  CALIBRATION_DRIFT:
    action: CALIBRATION_ADJUSTMENT
    strategy_codes: [calibration_only]
  PRIOR_PROBABILITY_SHIFT:
    action: CALIBRATION_ADJUSTMENT
    strategy_codes: [calibration_only]
  BUSINESS_THRESHOLD_MISMATCH:
    action: THRESHOLD_ADJUSTMENT
    strategy_codes: [threshold_only]
