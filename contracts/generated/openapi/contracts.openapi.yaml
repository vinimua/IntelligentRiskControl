openapi: 3.1.0
info:
  title: RiskItem ModelOps API
  version: 0.1.0
  description: 信贷风控模型智能监测与自主迭代系统 API。由 scripts/generate_openapi.py 从 FastAPI app 自动生成，不手工维护。
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Health Live
      description: 存活检查 — 进程是否在运行。
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      tags:
      - health
      summary: Health Ready
      description: 就绪检查 — 依赖服务是否可用。
      operationId: health_ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
