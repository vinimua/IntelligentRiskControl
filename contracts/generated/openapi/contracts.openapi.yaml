      description: 列出所有已知的 relation_key 及其最新权重。
      operationId: list_relation_keys_api_kg_relation_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/kg/stats:
    get:
      tags:
      - kg-calibration
      summary: Get Kg Stats
      description: KG 校准总体统计信息。
      operationId: get_kg_stats_api_kg_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/inference/{model_id}/routing-state:
    get:
      tags:
      - inference
      summary: Get Routing State
      description: 查询模型当前路由配置 — 哪个版本接收多少流量。
      operationId: get_routing_state_api_inference__model_id__routing_state_get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/inference/{model_id}/predict:
    post:
      tags:
      - inference
      summary: Predict
      description: '模拟预测 — 根据请求 ID 的稳定哈希分流到 champion 或 challenger。


        同一 request_id 始终路由到相同版本（确保用户体验一致）。'
      operationId: predict_api_inference__model_id__predict_post
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
              default:
                request_id: ''
                features: {}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/inference/{model_id}/batch-predict:
    post:
      tags:
      - inference
      summary: Batch Predict
      description: '批量模拟预测 — 展示流量分流效果。


        发送 100 个请求，可以看到 challenger 实际分到的比例。'
      operationId: batch_predict_api_inference__model_id__batch_predict_post
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          title: Model Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPredictRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    A7Authorization:
      properties:
        authorization_type:
          type: string
          enum:
          - AUTO_RULE
          - MANUAL_REVIEW
          title: Authorization Type
        authorization_id:
          type: string
          minLength: 1
          title: Authorization Id
        approved:
          type: boolean
          title: Approved
      additionalProperties: false
      type: object
      required:
      - authorization_type
      - authorization_id
      - approved
      title: A7Authorization
      description: "A7 授权契约。\n\n字段:\n    authorization_type: 授权类型——AUTO_RULE（自动规则）或\
        \ MANUAL_REVIEW（人工复核）。\n    authorization_id: 授权 ID（非空）。\n    approved: 是否已批准。"
    A7DecisionEnvelope:
      properties:
        contract_version:
          type: string
          const: a7-decision-envelope-v1
          title: Contract Version
          default: a7-decision-envelope-v1
        decision_source:
          type: string
          enum:
          - SIMULATED
          - NATURAL
          title: Decision Source
        lifecycle_run_id:
          type: string
          title: Lifecycle Run Id
        event_id:
          type: string
          title: Event Id
        monitoring_run_id:
          type: string
          title: Monitoring Run Id
        diagnosis_run_id:
          type: string
          title: Diagnosis Run Id
        agent_decision_id:
          type: string
          title: Agent Decision Id
        model_id:
          type: string
          title: Model Id
        champion_version:
          type: string
          title: Champion Version
        champion_artifact_checksum:
          type: string
          pattern: ^sha256:[0-9a-fA-F]{16,64}$
          title: Champion Artifact Checksum
        model_task_type:
          type: string
          const: BINARY_CLASSIFICATION
          title: Model Task Type
        algorithm_family:
          type: string
          enum:
          - LogisticRegression
          - RandomForest
          - XGBoost
          - LightGBM
          - CatBoost
          - EBM
          title: Algorithm Family
        recommended_action:
          type: string
          const: MODEL_ITERATION
          title: Recommended Action
        primary_root_cause:
          $ref: '#/components/schemas/A7PrimaryRootCause'
        decay_degree:
          type: string
          enum:
          - SHORT_TERM_7D
          - SUSTAINED_30D
          - SEVERE
          title: Decay Degree
        trigger_context:
          additionalProperties: true
          type: object
          title: Trigger Context
        kg_strategy_candidates:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Kg Strategy Candidates
        affected_segments:
          items:
            $ref: '#/components/schemas/AffectedSegment'
          type: array
          title: Affected Segments
        impact_scope:
          anyOf:
          - type: string
            enum:
            - LOCAL
            - GLOBAL
          - type: 'null'
          title: Impact Scope
        change_pattern:
          anyOf:
          - type: string
            enum:
            - GRADUAL
            - SUDDEN
          - type: 'null'
          title: Change Pattern
        change_point:
          anyOf:
          - type: string
          - type: 'null'
          title: Change Point
        ordered_evidence_window_ids:
          items:
            type: string
          type: array
          title: Ordered Evidence Window Ids
        authorization:
          $ref: '#/components/schemas/A7Authorization'
        rule_versions:
          additionalProperties:
            type: string
          type: object
          title: Rule Versions
      additionalProperties: false
      type: object
      required:
      - decision_source
      - lifecycle_run_id
      - event_id
      - monitoring_run_id
      - diagnosis_run_id
      - agent_decision_id
      - model_id
      - champion_version
      - champion_artifact_checksum
      - model_task_type
      - algorithm_family
      - recommended_action
      - primary_root_cause
      - decay_degree
      - trigger_context
      - authorization
      - rule_versions
      title: A7DecisionEnvelope
      description: "A7 决策信封——A7 L1 选择器唯一接受的输入契约。\n\n决策信封把 Agent 的一次 A7 决策「封」成结构化契约，任何字段缺失、越界或\n\
        跨字段矛盾都会在反序列化时被 model_validator 拒绝。其中：\n- decision_source 标记该决策是 SIMULATED（模拟回放）还是\
        \ NATURAL（自然运行产生）；\n- contract_version 固定为 \"a7-decision-envelope-v1\"，保证契约版本可追溯。\n\
        \n字段:\n    contract_version: 契约版本（固定 v1）。\n    decision_source: 决策来源——SIMULATED\
        \ / NATURAL。\n    lifecycle_run_id: 生命周期运行 ID。\n    event_id: 事件 ID。\n   \
        \ monitoring_run_id: 监控运行 ID。\n    diagnosis_run_id: 诊断运行 ID。\n    agent_decision_id:\
        \ Agent 决策 ID。\n    model_id: 目标模型 ID。\n    champion_version: Champion 版本。\n\
        \    champion_artifact_checksum: Champion 制品 checksum（sha256 格式）。\n    model_task_type:\
        \ 任务类型（固定二分类）。\n    algorithm_family: 算法家族。\n    recommended_action: 推荐动作（固定\
        \ MODEL_ITERATION，即 A7）。\n    primary_root_cause: 首要根因。\n    decay_degree:\
        \ 衰减程度——短期 7 天 / 持续 30 天 / 严重。\n    trigger_context: 触发上下文（字典）。\n    kg_strategy_candidates:\
        \ 知识图谱策略候选（列表）。\n    affected_segments: 受影响客群片段（列表）。\n    impact_scope: 影响范围——LOCAL\
        \ / GLOBAL（概念漂移时必填）。\n    change_pattern: 变化模式——GRADUAL / SUDDEN（概念漂移时必填）。\n\
        \    change_point: 变更点（突变型概念漂移时必填）。\n    ordered_evidence_window_ids: 有序证据窗口\
        \ ID（渐变型概念漂移时必填）。\n    authorization: 授权信息。\n    rule_versions: 规则版本表（含 agent/l1/window/qualification\
        \ 四个必需版本）。"
    A7PrimaryRootCause:
      properties:
        root_cause_code:
          type: string
          enum:
          - FEATURE_DRIFT
          - SEGMENT_DRIFT
          - CONCEPT_DRIFT
          title: Root Cause Code
        candidate_status:
          type: string
          const: CONFIRMED
          title: Candidate Status
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        evidence_refs:
          items:
            type: string
          type: array
          minItems: 1
          title: Evidence Refs
      additionalProperties: false
      type: object
      required:
      - root_cause_code
      - candidate_status
      - confidence
      - evidence_refs
      title: A7PrimaryRootCause
      description: "A7 首要根因契约。\n\n字段:\n    root_cause_code: 根因编码（仅自然漂移类：FEATURE_DRIFT/SEGMENT_DRIFT/CONCEPT_DRIFT）。\n\
        \    candidate_status: 候选状态——必须为 CONFIRMED（已确认）。\n    confidence: 置信度（0~1）。\n\
        \    evidence_refs: 证据引用（至少一条）。"
    AdvanceDeploymentRequest:
      properties:
        target_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Stage
        updated_by:
          type: string
          title: Updated By
          default: admin
        health_metrics:
          additionalProperties: true
          type: object
          title: Health Metrics
      type: object
      title: AdvanceDeploymentRequest
    AffectedSegment:
      properties:
        segment_id:
          type: string
          title: Segment Id
        segment_rule:
          additionalProperties: true
          type: object
          title: Segment Rule
        rule_version:
          type: string
          title: Rule Version
        evidence_window_id:
          type: string
          title: Evidence Window Id
        reference_share:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Reference Share
        current_share:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Current Share
        current_sample_count:
          type: integer
          minimum: 0.0
          title: Current Sample Count
        current_bad_count:
          type: integer
          minimum: 0.0
          title: Current Bad Count
        performance_affected:
          type: boolean
          title: Performance Affected
        primary:
          type: boolean
          title: Primary
          default: false
      additionalProperties: false
      type: object
      required:
      - segment_id
      - segment_rule
      - rule_version
      - evidence_window_id
      - reference_share
      - current_share
      - current_sample_count
      - current_bad_count
      - performance_affected
      title: AffectedSegment
      description: "受影响客群片段（漂移客群）契约。\n\n字段:\n    segment_id: 客群片段唯一标识。\n    segment_rule:\
        \ 客群圈选规则（字典）。\n    rule_version: 圈选规则版本。\n    evidence_window_id: 证据窗口 ID。\n\
        \    reference_share: 基准窗口中的客群占比（0~1）。\n    current_share: 当前窗口中的客群占比（0~1）。\n\
        \    current_sample_count: 当前窗口样本数（非负）。\n    current_bad_count: 当前窗口坏样本数（非负，且不能超过样本总数）。\n\
        \    performance_affected: 该片段性能是否受影响。\n    primary: 是否为首要受影响片段。"
